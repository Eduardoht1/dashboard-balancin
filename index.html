<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Balancin de Bola 5.231</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #e0e0e0;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --danger: #e74c3c;
            --success: #2ecc71;
            --disabled: #333;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        h1 { margin-bottom: 15px; font-size: 22px; text-align: center; }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 15px;
            max-width: 1400px;
            width: 100%;
            align-items: stretch; /* Obliga a ambos paneles a tener exactamente la misma altura */
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
            .chart-container { height: 350px !important; }
        }

        .panel {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            min-height: 200px;
        }

        /* --- LÍNEA CORREGIDA 1 --- */
        .panel-right {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0; /* Agregado para detener el crecimiento en Grid */
        }

        h2 { 
            margin: 0 0 12px 0;
            color: var(--accent); 
            border-bottom: 1px solid #444; 
            padding-bottom: 8px;
            text-align: center;
            font-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 4px 0;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-off { background-color: var(--danger); color: white; }
        .btn-on { background-color: var(--success); color: white; }
        .btn-accent { background-color: var(--accent); color: white; }
        .btn-accent:hover { background-color: var(--accent-hover); }
        .btn-disabled { background-color: var(--disabled) !important; color: #666 !important; cursor: not-allowed !important; }

        .telemetry-grid, .motor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 5px;
        }

        .motor-grid {
            grid-template-columns: 1fr 1fr 1fr;
            margin-top: 10px;
            border-top: 1px dashed #444;
            padding-top: 10px;
        }

        .data-box {
            background: #222;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid #333;
        }

        .data-label { font-size: 10px; color: #888; display: block; margin-bottom: 2px; }
        .data-value { font-size: 18px; font-weight: bold; color: var(--accent); font-family: monospace; }
        .pid-value { font-size: 12px; color: #f1c40f; font-weight: bold; }
        .percent-val { font-size: 11px; color: #aaa; margin-left: 4px; }

        /* --- LÍNEA CORREGIDA 2 --- */
        .chart-container {
            position: relative;
            width: 100%;
            flex-grow: 1; /* Hace que llene el hueco */
            min-height: 0; /* Cambiado de 520px a 0 para quitar el tamaño fijo */
            background: #222;
            border-radius: 8px;
        }
        
        /* --- LÍNEA CORREGIDA 3 --- */
        canvas { 
            border-radius: 8px; 
            /* Posición absoluta forza a Chart.js a someterse al tamaño de su contenedor */
            position: absolute !important;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }
        
        .status-ip { font-size: 11px; color: #777; margin-top: 10px; text-align: center; font-weight: bold; }

        .touchpad-area {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3; 
            background: #1e1e1e;
            border: 2px solid #444;
            border-radius: 8px;
            margin-top: 15px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .line-h { position: absolute; top: 50%; left: 0; width: 100%; height: 1px; border-top: 1px dashed rgba(255,255,255,0.2); }
        .line-v { position: absolute; top: 0; left: 50%; width: 1px; height: 100%; border-left: 1px dashed rgba(255,255,255,0.2); }
        
        .ball-dot {
            position: absolute;
            background: var(--accent);
            border-radius: 50%;
            transform: translate(-50%, -50%); 
            transition: top 0.05s linear, left 0.05s linear, opacity 0.3s; 
            top: 50%;
            left: 50%;
        }

        .ball-main { width: 16px; height: 16px; box-shadow: 0 0 8px var(--accent); z-index: 10; opacity: 1; }
        .ghost-1   { width: 14px; height: 14px; z-index: 4; opacity: 0; }
        .ghost-2   { width: 12px; height: 12px; z-index: 3; opacity: 0; }
        .ghost-3   { width: 10px; height: 10px; z-index: 2; opacity: 0; }
        .ghost-4   { width: 8px;  height: 8px;  z-index: 1; opacity: 0; }

        /* --- ESTILOS DEL PANEL DE AJUSTES INFERIOR --- */
        .tuning-panel {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-top: 15px;
            width: 100%;
            max-width: 1400px;
            box-sizing: border-box;
        }

        .tuning-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 15px;
            align-items: end;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group label {
            font-size: 11px;
            color: #888;
            margin-bottom: 2px;
        }

        /* Valor actual en la ESP (Solo lectura) */
        .current-val {
            font-size: 13px;
            color: var(--accent);
            font-family: monospace;
            font-weight: bold;
            margin-bottom: 6px;
            text-align: center;
        }

        .tuning-grid input {
            background: #111;
            border: 1px solid #444;
            color: #f1c40f; /* Amarillo para input */
            padding: 8px 4px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
            /* Quitar las flechitas */
            -moz-appearance: textfield;
        }
        
        .tuning-grid input::-webkit-outer-spin-button,
        .tuning-grid input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .tuning-grid input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Divisores visuales suaves entre grupos X e Y */
        .col-spx { border-right: 1px solid #444; padding-right: 15px; }
        .col-kpy { padding-left: 15px; }

        .btn-container {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .btn-container .btn { width: 300px; margin: 0; }

        /* Colores específicos para Y */
        .label-y { color: #e74c3c !important; }
        .val-y { color: #e74c3c !important; }

    </style>
</head>
<body>

    <h1>Dashboard Control Balancin 5.231</h1>

    <div class="container">
        <div class="panel" id="mainPanel">
            <h2>Panel de Control</h2>
            <button id="btnMotores" class="btn btn-off" onclick="sendCmd('motores')">MOTORES: OFF</button>
            <button id="btnControl" class="btn btn-disabled" onclick="sendCmd('control')" disabled>CONTROL PID: OFF</button>
            <div class="status-ip" id="mqttStatus">Estado: Conectando...</div>

            <h2 style="margin-top: 20px;">Telemetría</h2>
            <div class="telemetry-grid">
                <div class="data-box"><span class="data-label">Pos X</span><span id="v_posX" class="data-value">0</span></div>
                <div class="data-box"><span class="data-label">Pos Y</span><span id="v_posY" class="data-value">0</span></div>
                <div class="data-box"><span class="data-label">Error X</span><span id="v_errX" class="data-value">0.00</span><span id="p_errX" class="percent-val">0%</span></div>
                <div class="data-box"><span class="data-label">Error Y</span><span id="v_errY" class="data-value">0.00</span><span id="p_errY" class="percent-val">0%</span></div>
            </div>

            <h2 style="margin-top: 15px;">Vista 2D (Touchpad)</h2>
            <div class="touchpad-area" id="touchpadArea">
                <div class="line-h"></div>
                <div class="line-v"></div>
                
                <div id="ghost4" class="ball-dot ghost-4"></div>
                <div id="ghost3" class="ball-dot ghost-3"></div>
                <div id="ghost2" class="ball-dot ghost-2"></div>
                <div id="ghost1" class="ball-dot ghost-1"></div>
                <div id="ballDot" class="ball-dot ball-main"></div>
            </div>

            <div class="motor-grid">
                <div class="data-box"><span class="data-label">Servo 1</span><span id="v_s1" class="pid-value">0°</span></div>
                <div class="data-box"><span class="data-label">Servo 2</span><span id="v_s2" class="pid-value">0°</span></div>
                <div class="data-box"><span class="data-label">Servo 3</span><span id="v_s3" class="pid-value">0°</span></div>
            </div>
        </div>

        <div class="panel panel-right">
            <h2>Posición Histórica</h2>
            <div class="chart-container">
                <canvas id="chartPos"></canvas>
            </div>
        </div>
    </div>

    <div class="tuning-panel">
        <h2>Ajustes de Control (Sintonización en Vivo)</h2>
        
        <div class="tuning-grid">
            <div class="input-group">
                <label>Kp X</label>
                <div class="current-val" id="curr_kpx">0.000</div>
                <input type="number" id="in_kpx" step="0.001">
            </div>
            <div class="input-group">
                <label>Ki X</label>
                <div class="current-val" id="curr_kix">0.000</div>
                <input type="number" id="in_kix" step="0.001">
            </div>
            <div class="input-group">
                <label>Kd X</label>
                <div class="current-val" id="curr_kdx">0.000</div>
                <input type="number" id="in_kdx" step="0.001">
            </div>
            <div class="input-group col-spx">
                <label style="color: var(--accent);">Setpoint X</label>
                <div class="current-val" id="curr_spx">550</div>
                <input type="number" id="in_spx" step="1">
            </div>

            <div class="input-group col-kpy">
                <label class="label-y">Kp Y</label>
                <div class="current-val val-y" id="curr_kpy">0.000</div>
                <input type="number" id="in_kpy" step="0.001">
            </div>
            <div class="input-group">
                <label class="label-y">Ki Y</label>
                <div class="current-val val-y" id="curr_kiy">0.000</div>
                <input type="number" id="in_kiy" step="0.001">
            </div>
            <div class="input-group">
                <label class="label-y">Kd Y</label>
                <div class="current-val val-y" id="curr_kdy">0.000</div>
                <input type="number" id="in_kdy" step="0.001">
            </div>
            <div class="input-group">
                <label class="label-y">Setpoint Y</label>
                <div class="current-val val-y" id="curr_spy">550</div>
                <input type="number" id="in_spy" step="1">
            </div>
        </div>
        
        <div class="btn-container">
            <button class="btn btn-accent" onclick="enviarAjustes()">Aplicar Nuevos Ajustes a ESP32</button>
        </div>
    </div>

    <script>
        const TOPIC_DATA = "delta/eduhdz/telemetria";
        const TOPIC_CMD = "delta/eduhdz/comandos";
        
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        let estadoActual = { motores: false, control: false };
        let labelsCount = 400; 
        let tiempoInicio = 0; 
        let posChart;
        let posHistory = [];
        let timeoutESP;
        let isESPConnected = false;
        
        let inputsLlenados = false;

        window.onload = function() {
            const ctx = document.getElementById('chartPos').getContext('2d');
            posChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(labelsCount).fill("0.00"),
                    datasets: [
                        { label: 'Pos X', borderColor: '#3498db', data: Array(labelsCount).fill(550), borderWidth: 2, pointRadius: 0, fill: false, tension: 0.1 },
                        { label: 'Pos Y', borderColor: '#e74c3c', data: Array(labelsCount).fill(550), borderWidth: 2, pointRadius: 0, fill: false, tension: 0.1 },
                        { label: 'Setpoint X', borderColor: 'rgba(52, 152, 219, 0.4)', data: Array(labelsCount).fill(550), borderWidth: 1, borderDash: [5, 5], pointRadius: 0, fill: false },
                        { label: 'Setpoint Y', borderColor: 'rgba(231, 76, 60, 0.4)', data: Array(labelsCount).fill(550), borderWidth: 1, borderDash: [5, 5], pointRadius: 0, fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: { 
                        y: { min: 0, max: 1000, grid: { color: '#333' }, ticks: { color: '#aaa' } }, 
                        x: { ticks: { color: '#666', autoSkip: true, maxTicksLimit: 8 } } 
                    },
                    plugins: { 
                        legend: { labels: { color: 'white' } },
                        tooltip: {
                            enabled: true,
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            callbacks: {
                                title: function(context) { return 'Tiempo: ' + context[0].label + 's'; }
                            }
                        }
                    }
                }
            });
        };

        client.on('connect', () => {
            document.getElementById('mqttStatus').innerText = "Conectado a la Nube (WSS) - Esperando ESP...";
            document.getElementById('mqttStatus').style.color = "#f1c40f"; 
            client.subscribe(TOPIC_DATA);
        });

        client.on('message', (topic, message) => {
            const data = JSON.parse(message.toString());
            
            if (!isESPConnected) {
                isESPConnected = true;
                document.getElementById('mqttStatus').innerText = "Conectado a la Nube (WSS) - Conectado a la ESP";
                document.getElementById('mqttStatus').style.color = "#2ecc71"; 
            }
            
            clearTimeout(timeoutESP);
            timeoutESP = setTimeout(() => {
                isESPConnected = false;
                document.getElementById('mqttStatus').innerText = "Conectado a la Nube (WSS) - ESP Desconectada";
                document.getElementById('mqttStatus').style.color = "#e74c3c"; 
            }, 1000); 

            if(data.m_on !== undefined) {
                if (data.c_on === true && estadoActual.control === false) {
                    resetChart(data.spx || 550, data.spy || 550);
                    tiempoInicio = Date.now();
                }
                estadoActual.motores = data.m_on;
                estadoActual.control = data.c_on;
                actualizarUI();
            }

            let posX_final = data.posX;
            let posY_final = data.posY > 1001 ? 0 : data.posY;
            let spx_actual = data.spx !== undefined ? data.spx : 550;
            let spy_actual = data.spy !== undefined ? data.spy : 550;

            document.getElementById('v_posX').innerText = Math.round(posX_final);
            document.getElementById('v_posY').innerText = Math.round(posY_final);
            document.getElementById('v_errX').innerText = data.errX.toFixed(2);
            document.getElementById('v_errY').innerText = data.errY.toFixed(2);
            
            document.getElementById('p_errX').innerText = `${((posX_final - spx_actual) / 4.15).toFixed(1)}%`;
            document.getElementById('p_errY').innerText = `${((posY_final - spy_actual) / 4.5).toFixed(1)}%`;

            const dot = document.getElementById('ballDot');
            const ghosts = [
                document.getElementById('ghost1'), document.getElementById('ghost2'),
                document.getElementById('ghost3'), document.getElementById('ghost4')
            ];

            if (posX_final === 0 && posY_final === 0) {
                posHistory = [];
                dot.style.opacity = '0.2';
                dot.style.top = '50%'; dot.style.left = '50%';
                ghosts.forEach(g => g.style.opacity = '0');
            } else {
                let topPct = Math.min(Math.max(((posX_final - 135) / 830) * 100, 0), 100);
                let leftPct = Math.min(Math.max(((posY_final - 50) / 1000) * 100, 0), 100);

                posHistory.unshift({ top: topPct, left: leftPct });
                if (posHistory.length > 5) posHistory.pop(); 

                dot.style.opacity = '1';
                dot.style.top = posHistory[0].top + '%';
                dot.style.left = posHistory[0].left + '%';

                const opacities = [0.6, 0.4, 0.2, 0.1];
                for (let i = 0; i < 4; i++) {
                    if (posHistory[i + 1]) {
                        ghosts[i].style.opacity = opacities[i];
                        ghosts[i].style.top = posHistory[i + 1].top + '%';
                        ghosts[i].style.left = posHistory[i + 1].left + '%';
                    } else { ghosts[i].style.opacity = '0'; }
                }
            }

            if(data.s1 !== undefined) {
                document.getElementById('v_s1').innerText = Math.round(data.s1) + "°";
                document.getElementById('v_s2').innerText = Math.round(data.s2) + "°";
                document.getElementById('v_s3').innerText = Math.round(data.s3) + "°";
            }

            if(data.kpx !== undefined) {
                document.getElementById('curr_kpx').innerText = data.kpx.toFixed(4);
                document.getElementById('curr_kix').innerText = data.kix.toFixed(4);
                document.getElementById('curr_kdx').innerText = data.kdx.toFixed(4);
                document.getElementById('curr_spx').innerText = Math.round(spx_actual);
                
                document.getElementById('curr_kpy').innerText = data.kpy.toFixed(4);
                document.getElementById('curr_kiy').innerText = data.kiy.toFixed(4);
                document.getElementById('curr_kdy').innerText = data.kdy.toFixed(4);
                document.getElementById('curr_spy').innerText = Math.round(spy_actual);

                if(!inputsLlenados) {
                    document.getElementById('in_kpx').value = data.kpx.toFixed(4);
                    document.getElementById('in_kix').value = data.kix.toFixed(4);
                    document.getElementById('in_kdx').value = data.kdx.toFixed(4);
                    document.getElementById('in_kpy').value = data.kpy.toFixed(4);
                    document.getElementById('in_kiy').value = data.kiy.toFixed(4);
                    document.getElementById('in_kdy').value = data.kdy.toFixed(4);
                    document.getElementById('in_spx').value = spx_actual;
                    document.getElementById('in_spy').value = spy_actual;
                    inputsLlenados = true; 
                }
            }

            if (estadoActual.control && posChart) {
                if(tiempoInicio === 0) tiempoInicio = Date.now();
                let tActual = ((Date.now() - tiempoInicio) / 1000).toFixed(2);
                updateChart(posX_final, posY_final, spx_actual, spy_actual, tActual);
            } else {
                tiempoInicio = 0;
            }
        });

        client.on('error', (err) => {
            document.getElementById('mqttStatus').innerText = "Fallo: " + err;
            document.getElementById('mqttStatus').style.color = "#e74c3c";
        });

        function sendCmd(tipo) {
            let nEstado = { ...estadoActual };
            if (tipo === 'motores') {
                nEstado.motores = !estadoActual.motores;
                if(!nEstado.motores) nEstado.control = false;
            } else {
                nEstado.control = !estadoActual.control;
            }
            client.publish(TOPIC_CMD, JSON.stringify(nEstado));
        }

        function enviarAjustes() {
            let payload = {};
            
            let kpx = parseFloat(document.getElementById('in_kpx').value);
            let kix = parseFloat(document.getElementById('in_kix').value);
            let kdx = parseFloat(document.getElementById('in_kdx').value);
            if(!isNaN(kpx) && !isNaN(kix) && !isNaN(kdx)) { payload.kpx = kpx; payload.kix = kix; payload.kdx = kdx; }

            let kpy = parseFloat(document.getElementById('in_kpy').value);
            let kiy = parseFloat(document.getElementById('in_kiy').value);
            let kdy = parseFloat(document.getElementById('in_kdy').value);
            if(!isNaN(kpy) && !isNaN(kiy) && !isNaN(kdy)) { payload.kpy = kpy; payload.kiy = kiy; payload.kdy = kdy; }

            let spx = parseFloat(document.getElementById('in_spx').value);
            let spy = parseFloat(document.getElementById('in_spy').value);
            if(!isNaN(spx)) payload.spx = spx;
            if(!isNaN(spy)) payload.spy = spy;

            if(Object.keys(payload).length > 0) {
                client.publish(TOPIC_CMD, JSON.stringify(payload));
                
                const btn = document.querySelector('.tuning-panel .btn-accent');
                const textOrig = btn.innerText;
                btn.innerText = "¡Enviado!";
                btn.style.backgroundColor = "#2ecc71";
                setTimeout(() => {
                    btn.innerText = textOrig;
                    btn.style.backgroundColor = "var(--accent)";
                }, 1000);
            }
        }

        function actualizarUI() {
            const btnM = document.getElementById('btnMotores');
            const btnC = document.getElementById('btnControl');
            btnM.className = estadoActual.motores ? "btn btn-on" : "btn btn-off";
            btnM.innerText = `MOTORES: ${estadoActual.motores ? 'ON' : 'OFF'}`;
            if (!estadoActual.motores) {
                btnC.disabled = true;
                btnC.className = "btn btn-disabled";
                btnC.innerText = "CONTROL PID: OFF";
            } else {
                btnC.disabled = false;
                btnC.className = estadoActual.control ? "btn btn-on" : "btn btn-off";
                btnC.innerText = `CONTROL PID: ${estadoActual.control ? 'ON' : 'OFF'}`;
            }
        }

        function resetChart(spx, spy) {
            if(!posChart) return;
            posChart.data.labels = Array(labelsCount).fill("0.00");
            posChart.data.datasets[0].data = Array(labelsCount).fill(spx);
            posChart.data.datasets[1].data = Array(labelsCount).fill(spy);
            posChart.data.datasets[2].data = Array(labelsCount).fill(spx);
            posChart.data.datasets[3].data = Array(labelsCount).fill(spy);
            posChart.update('none');
        }

        function updateChart(px, py, spx, spy, t) {
            if(!posChart) return;
            posChart.data.datasets[0].data.push(px); posChart.data.datasets[0].data.shift();
            posChart.data.datasets[1].data.push(py); posChart.data.datasets[1].data.shift();
            posChart.data.datasets[2].data.push(spx); posChart.data.datasets[2].data.shift();
            posChart.data.datasets[3].data.push(spy); posChart.data.datasets[3].data.shift();
            
            posChart.data.labels.push(t); posChart.data.labels.shift();
            posChart.update('none'); 
        }
    </script>
</body>
</html>
